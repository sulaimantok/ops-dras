#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - rsync

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - mkdir -p /home/ubuntu/ops-dras
  - chown ubuntu:ubuntu /home/ubuntu/ops-dras
  - bash -c "printf 'ops-dras test VM\nApp dir: /home/ubuntu/ops-dras\nDeploy: rsync your ops-dras/ project here, then run: cd ~/ops-dras && docker compose up -d --build\n' > /etc/motd"
